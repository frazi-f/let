<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Happy Birthday, Beautiful</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }

    body {
      background: linear-gradient(145deg, #ffd6e8 0%, #f2c6cc 30%, #d9a7e0 70%, #c8a2e8 100%);
      background-attachment: fixed;
      font-family: 'Quicksand', sans-serif;
      color: #713b4b;
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    /* floating decor */
    .floating-decor {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .decor-item {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.2;
      animation: floatAround 18s infinite alternate ease-in-out;
      color: #d99aa6;
      filter: drop-shadow(0 4px 6px rgba(197, 139, 131, 0.1));
    }

    @keyframes floatAround {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(20px, -30px) rotate(8deg); }
      100% { transform: translate(-10px, 20px) rotate(-5deg); }
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #c58b83;
      border-radius: 50%;
      opacity: 0.25;
      box-shadow: 0 0 12px #d99aa6;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 1.2rem 4rem;
      position: relative;
      z-index: 2;
    }

    /* hero */
    .hero {
      text-align: center;
      margin-bottom: 3.5rem;
      animation: fadeSlideUp 1.2s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
      opacity: 0;
    }

    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 8vw, 5.5rem);
      color: #713b4b;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.75rem;
      position: relative;
      display: inline-block;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
    }

    .hero h1::before {
      content: '✨';
      font-size: 0.4em;
      position: absolute;
      left: -38px;
      top: 15px;
      opacity: 0.7;
    }

    .hero h1::after {
      content: '🌸';
      font-size: 0.35em;
      position: absolute;
      right: -42px;
      bottom: 8px;
      opacity: 0.8;
    }

    .hero-sub {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.5rem, 5vw, 2.8rem);
      color: #8a4a5e;
      margin-top: 0.5rem;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.6);
    }

    /* video gallery - flex column, no overlap */
    .video-gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      margin-top: 1.5rem;
      margin-bottom: 4rem;
      position: relative;
      z-index: 1;
    }

    /* card - no overlapping */
    .video-card {
      width: 100%;
      max-width: 340px;
      border-radius: 1.8rem;
      background: rgba(255, 243, 232, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 20px 35px -12px rgba(113, 59, 75, 0.35), 0 8px 20px -6px rgba(197, 139, 131, 0.3);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: cardAppear 0.8s ease backwards;
      isolation: isolate;
    }

    .video-card:nth-child(1) { animation-delay: 0.2s; }
    .video-card:nth-child(2) { animation-delay: 0.35s; }
    .video-card:nth-child(3) { animation-delay: 0.5s; }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .video-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 45px -15px rgba(113, 59, 75, 0.45), 0 12px 25px -8px #c58b83;
    }

    /* ---- UNIQUE FRAMES with GLOW ---- */
    .frame-blush {
      border: 2px solid #fff0f5;
      box-shadow: 0 0 0 2px #f2c6cc,
                  0 0 18px 4px rgba(217, 154, 166, 0.7),
                  0 0 35px 8px rgba(242, 198, 204, 0.4),
                  0 20px 35px -12px #d99aa6;
      position: relative;
    }

    .frame-blush::before {
      content: '🌸';
      position: absolute;
      top: -16px;
      left: 16px;
      font-size: 1.8rem;
      filter: drop-shadow(0 4px 6px #d99aa6);
      transform: rotate(-15deg);
      z-index: 5;
      pointer-events: none;
    }

    .frame-blush::after {
      content: '🌿';
      position: absolute;
      bottom: -10px;
      right: 12px;
      font-size: 1.8rem;
      transform: rotate(25deg);
      opacity: 0.8;
      z-index: 5;
      pointer-events: none;
    }

    .frame-scrapbook {
      border: 2px solid #f4bfa8;
      box-shadow: 0 0 0 3px #fff3e8,
                  0 0 0 5px #d99aa6,
                  0 0 18px 4px rgba(244, 191, 168, 0.8),
                  0 0 32px 8px rgba(217, 154, 166, 0.35),
                  0 20px 35px -12px #713b4b;
      transform: rotate(-0.4deg);
      position: relative;
    }

    .frame-scrapbook::before {
      content: '📸';
      position: absolute;
      top: -20px;
      left: 8px;
      font-size: 2rem;
      filter: drop-shadow(0 6px 8px #c58b83);
      transform: rotate(-8deg);
      z-index: 5;
      pointer-events: none;
    }

    .frame-scrapbook::after {
      content: '✨';
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-size: 1.8rem;
      opacity: 0.8;
      z-index: 5;
      pointer-events: none;
    }

    .frame-luxe {
      border: 2px solid #c58b83;
      background: #2e1a1f;
      box-shadow: 0 0 0 2px #713b4b,
                  0 0 18px 4px rgba(197, 139, 131, 0.9),
                  0 0 40px 10px rgba(230, 195, 184, 0.35),
                  0 20px 40px -10px #713b4b;
      position: relative;
    }

    .frame-luxe::before {
      content: '✦';
      position: absolute;
      top: -14px;
      right: 22px;
      font-size: 2rem;
      color: #e6c3b8;
      text-shadow: 0 0 15px #f2c6cc, 0 0 30px #c58b83;
      z-index: 5;
      pointer-events: none;
    }

    .frame-luxe::after {
      content: '✦';
      position: absolute;
      bottom: -8px;
      left: 18px;
      font-size: 1.6rem;
      color: #c58b83;
      text-shadow: 0 0 15px #e6c3b8, 0 0 30px #d99aa6;
      z-index: 5;
      pointer-events: none;
    }

    /* ---- VIDEO AREA 3:4 ---- */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #1e1216;
      border-radius: 1.6rem 1.6rem 0 0;
      overflow: hidden;
      z-index: 1;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* captions */
    .card-caption {
      padding: 1rem 1rem 1.2rem;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: #713b4b;
      background: inherit;
      position: relative;
      border-top: 1px solid rgba(197, 139, 131, 0.3);
      z-index: 2;
    }

    .frame-luxe .card-caption {
      color: #f2c6cc;
      background: #2e1a1f;
      border-top-color: #c58b83;
    }

    .frame-scrapbook .card-caption {
      font-family: 'Great Vibes', cursive;
      font-size: 1.6rem;
      color: #713b4b;
      padding: 0.7rem 1rem 0.9rem;
    }

    .frame-blush .card-caption {
      font-family: 'Great Vibes', cursive;
      font-size: 1.7rem;
      color: #8a4a5e;
    }

    /* final message */
    .final-message {
      text-align: center;
      padding: 2.2rem 1.5rem 1.8rem;
      background: rgba(255, 243, 232, 0.65);
      border-radius: 3rem 3rem 1.8rem 1.8rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 15px 35px -10px #d99aa6,
                  0 0 25px 5px rgba(242, 198, 204, 0.4);
      border: 1px solid rgba(242, 198, 204, 0.7);
      margin-top: 1rem;
      animation: fadeSlideUp 1s 0.6s backwards;
      position: relative;
      z-index: 1;
    }

    .final-message p {
      font-size: 1.15rem;
      max-width: 700px;
      margin: 0 auto 1.5rem;
      color: #713b4b;
      font-weight: 500;
      line-height: 1.8;
      font-family: 'Quicksand', sans-serif;
    }

    .final-message .signature {
      font-family: 'Great Vibes', cursive;
      font-size: 2.4rem;
      color: #8a4a5e;
      text-shadow: 0 2px 12px #f2c6cc;
      margin-top: 0.8rem;
      line-height: 1.3;
    }

    .final-message .signature small {
      display: block;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: #713b4b;
      margin-top: 0.4rem;
      text-transform: uppercase;
      opacity: 0.7;
    }

    /* ---- DRAGGABLE HOME BUTTON ---- */
    .home-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #f2c6cc, #d99aa6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(113, 59, 75, 0.5),
                  0 0 20px rgba(242, 198, 204, 0.7);
      border: 2px solid #fff3e8;
      cursor: grab;
      z-index: 9999;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .home-btn:active {
      cursor: grabbing;
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(113, 59, 75, 0.6),
                  0 0 25px rgba(242, 198, 204, 0.9);
    }

    .home-btn svg {
      width: 26px;
      height: 26px;
      fill: #713b4b;
      pointer-events: none;
    }

    /* ---- RESPONSIVE ---- */
    @media (min-width: 700px) {
      .video-gallery {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2.2rem;
      }
      .video-card {
        flex: 0 1 320px;
        max-width: 360px;
      }
      .hero h1::before { left: -50px; }
      .hero h1::after { right: -55px; }
    }

    @media (min-width: 1024px) {
      .container { padding: 2.5rem 1.5rem 5rem; }
      .video-gallery { gap: 3rem; }
      .video-card { max-width: 380px; }
    }

    @supports (padding: max(0px)) {
      body {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      .home-btn {
        bottom: max(20px, env(safe-area-inset-bottom) + 16px);
        right: max(20px, env(safe-area-inset-right) + 16px);
      }
    }
  </style>
</head>
<body>
  <div class="floating-decor" id="floatingDecor"></div>

  <a href="https://frazi-f.github.io/kjh/" class="home-btn" id="homeBtn" aria-label="Back to home">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/>
    </svg>
  </a>

  <div class="container">
    <header class="hero">
      <h1>Happy Birthday, Beautiful!</h1>
      <div class="hero-sub">wishing you a day as lovely as you are</div>
    </header>

    <section class="video-gallery">
      <!-- CARD 1 -->
      <div class="video-card frame-blush">
        <div class="video-wrapper" id="video1-wrapper">
          <video id="video1" controls playsinline preload="metadata">
            <source src="v1.mp4" type="video/mp4">
          </video>
        </div>
        <div class="card-caption">🎶🎼</div>
      </div>

      <!-- CARD 2 -->
      <div class="video-card frame-scrapbook">
        <div class="video-wrapper" id="video2-wrapper">
          <video id="video2" controls playsinline preload="metadata">
            <source src="v2.mp4" type="video/mp4">
          </video>
        </div>
        <div class="card-caption">📸💥</div>
      </div>

      <!-- CARD 3 -->
      <div class="video-card frame-luxe">
        <div class="video-wrapper" id="video3-wrapper">
          <video id="video3" controls playsinline preload="metadata">
            <source src="v3.mp4" type="video/mp4">
          </video>
        </div>
        <div class="card-caption">✨✨</div>
      </div>
    </section>

    <section class="final-message">
      <p>May your life always be filled with happiness, beautiful memories, endless blessings, and the love of God. Keep being the wonderful person you are.</p>
      <div class="signature">With love, Happy Birthday!<small>forever & always</small></div>
    </section>
  </div>

  <script>
    (function() {
      // ---- FLOATING DECOR ----
      const decorContainer = document.getElementById('floatingDecor');
      const decorIcons = ['🌸', '🌼', '✨', '🌸', '🌺', '✨', '🌷', '⭐', '🌿', '✨'];
      const sparkleCount = 20;
      const flowerCount = 8;

      for (let i = 0; i < sparkleCount; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = Math.random() * 100 + '%';
        sparkle.style.top = Math.random() * 100 + '%';
        sparkle.style.animation = `floatAround ${12 + Math.random() * 15}s infinite alternate ease-in-out`;
        sparkle.style.animationDelay = Math.random() * 5 + 's';
        decorContainer.appendChild(sparkle);
      }

      for (let i = 0; i < flowerCount; i++) {
        const item = document.createElement('div');
        item.className = 'decor-item';
        item.textContent = decorIcons[Math.floor(Math.random() * decorIcons.length)];
        item.style.left = Math.random() * 100 + '%';
        item.style.top = Math.random() * 100 + '%';
        item.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
        item.style.animationDuration = (12 + Math.random() * 12) + 's';
        item.style.animationDelay = Math.random() * 6 + 's';
        decorContainer.appendChild(item);
      }

      // ---- DRAGGABLE HOME BUTTON ----
      const homeBtn = document.getElementById('homeBtn');
      let isDragging = false;
      let wasDragged = false;
      let startX, startY, startLeft, startTop;

      homeBtn.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        isDragging = true;
        wasDragged = false;

        const rect = homeBtn.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;
        startX = e.clientX;
        startY = e.clientY;

        homeBtn.style.left = startLeft + 'px';
        homeBtn.style.top = startTop + 'px';
        homeBtn.style.right = 'auto';
        homeBtn.style.bottom = 'auto';
        homeBtn.style.cursor = 'grabbing';

        homeBtn.setPointerCapture(e.pointerId);
      });

      homeBtn.addEventListener('pointermove', function(e) {
        if (!isDragging) return;
        e.preventDefault();

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          wasDragged = true;
        }

        let newLeft = startLeft + dx;
        let newTop = startTop + dy;

        const btnW = homeBtn.offsetWidth;
        const btnH = homeBtn.offsetHeight;
        newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - btnW));
        newTop = Math.max(0, Math.min(newTop, window.innerHeight - btnH));

        homeBtn.style.left = newLeft + 'px';
        homeBtn.style.top = newTop + 'px';
      });

      homeBtn.addEventListener('pointerup', function(e) {
        isDragging = false;
        homeBtn.style.cursor = 'grab';
        homeBtn.releasePointerCapture(e.pointerId);
      });

      homeBtn.addEventListener('pointercancel', function(e) {
        isDragging = false;
        homeBtn.style.cursor = 'grab';
      });

      homeBtn.addEventListener('click', function(e) {
        if (wasDragged) {
          e.preventDefault();
          wasDragged = false;
        }
      });

      // ---- VIDEO HANDLING (only one plays at a time) ----
      const videos = {
        video1: document.getElementById('video1'),
        video2: document.getElementById('video2'),
        video3: document.getElementById('video3')
      };
      let currentlyPlaying = null;

      function pauseOthers(exceptId) {
        for (let id in videos) {
          if (id === exceptId) continue;
          if (!videos[id].paused) {
            videos[id].pause();
            videos[id].currentTime = 0;
          }
        }
      }

      for (let id in videos) {
        videos[id].addEventListener('play', function() {
          if (currentlyPlaying !== id) {
            pauseOthers(id);
            currentlyPlaying = id;
          }
        });

        videos[id].addEventListener('ended', function() {
          if (currentlyPlaying === id) currentlyPlaying = null;
        });

        videos[id].addEventListener('pause', function() {
          if (currentlyPlaying === id && !videos[id].ended) {
            currentlyPlaying = null;
          }
        });
      }
    })();
  </script>
</body>
</html>
